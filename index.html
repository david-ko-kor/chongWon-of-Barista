function instruction(){if(view==='lobby')return service==='handoff'?'준비한 컵을 화살표를 따라 손님께 드리세요.':service==='payment'?'영수증을 확인하고 결제 받기를 눌러 주세요.':service==='goodbye'?'다정하게 인사하고 다음 손님을 맞이하세요.':service==='greet'?'「반갑게 인사하기」를 눌러 손님을 맞이하세요.':service==='chat'?'말풍선 아래에서 내가 손님께 할 말을 하나 골라 주세요.':service==='chat_reply'?'손님의 답을 읽고 「이제 주문 도와드릴게요」를 누르세요.':'메뉴와 온도를 확인한 뒤 만들기를 눌러 주세요.';return ({filter:'포터필터를 머신에서 빼서 왼쪽 그라인더 받침으로 드래그하세요.',grind:'그라인더의 「꾹 분쇄」를 길게 눌렀다가 초록 구간에서 놓으세요.',mat:'원두가 담긴 포터필터를 아래 탬핑 매트로 옮기세요.',tamp:'옆의 탬퍼를 포터필터 위로 드래그해 꾹 눌러 다지세요.',mount:'탬핑한 포터필터를 가운데 머신 장착부로 드래그하세요.',cup:order.parts.includes('shot')?'선반의 빈 컵을 머신 아래 「컵 놓는 곳」으로 옮기세요.':'선반의 빈 컵을 오른쪽 마무리 테이블로 옮기세요.',brew:'머신의 「추출」 버튼을 길게 누르고 초록 구간에서 놓으세요.',finish:'아래 「우유·마무리 작업대 →」를 눌러 오른쪽으로 이동하세요.',ingredients:order.parts.includes('milk')&&!parts.includes('milk')?(order.cold?'우유 피처를 컵으로 드래그해 차가운 우유를 부으세요.':!milkReady?'우유 피처를 스팀 완드로 옮기고 「스팀」을 길게 눌러 데우세요.':'데운 우유 피처를 컵으로 드래그해 부으세요.'):'주문에 맞춰 물·우유·얼음을 컵으로 드래그하세요.',serve:'완성된 컵을 오른쪽 위 서빙 트레이로 드래그하세요.'})[step]||'음료를 만들어 주세요.'}
function render(){svg.innerHTML=stylize(view==='lobby'?lobbyArt():workArt())+(view==='work'?guideArt():'');$('day').textContent=state.day+'일째';$('count').textContent='손님 '+state.count+' / 5';$('money').textContent='₩ '+state.money.toLocaleString();$('speech').classList.toggle('hidden',view!=='lobby');$('note').classList.toggle('hidden',view!=='work');$('note').innerHTML='<b>주문서</b>'+(order.cold?'아이스 ':'따뜻한 ')+order.name+'<br><small>'+order.parts.map(x=>({shot:'에스프레소',water:'물',milk:'우유',choco:'초콜릿'})[x]).join(' + ')+(order.cold?' + 얼음':'')+'</small>';renderService();$('bench-nav').classList.toggle('hidden',view!=='work');$('bench-left').disabled=benchView==='machine';$('bench-right').disabled=benchView==='finish';$('bench-title').textContent=benchView==='finish'?'우유 · 마무리 작업대':'에스프레소 작업대';$('stage').classList.toggle('camera-finish',view==='work'&&benchView==='finish');$('hint').textContent=instruction();$('stepnum').textContent=view==='lobby'?'☕':({filter:1,grind:2,mat:3,tamp:4,mount:5,cup:6,brew:7,finish:8,ingredients:9,serve:10}[step]||'☕');$('reset').disabled=view==='lobby';$('reset').hidden=view==='lobby';$('subhint').textContent=view==='lobby'&&service!=='handoff'?'버튼을 눌러 손님과 대화를 이어가세요.':'도구를 드래그하거나, 도구를 클릭한 뒤 놓을 곳을 클릭해도 돼요.';syncFocus();}
function move(id,target){if(id==='guestCup'&&target==='customer'&&service==='handoff'){handToCustomer();return}if(holding){toast('먼저 누르고 있는 작업을 마쳐 주세요.');return}if(id==='filter'){if(target==='grinder'&&step==='filter'){filterAt='grinder';step='grind';toast('포터필터를 그라인더에 끼웠어요.')}else if(target==='mat'&&step==='mat'){filterAt='mat';positions.tamper=[350,440];step='tamp'}else if(target==='machine'&&step==='mount'){filterAt='machine';step='cup';toast('찰칵! 머신에 단단히 장착했어요.')}else toast('안내에 표시된 자리로 포터필터를 옮겨 주세요.')}else if(id==='tamper'){if((target==='mat'||target==='filter')&&step==='tamp'){tampReady=true;positions.tamper=[350,490];attemptFeedback='';toast('탬퍼를 올렸어요. 「꾹 탬핑」을 길게 눌러 압력을 맞춰 주세요.')}else toast('원두를 간 다음 포터필터를 탬핑 매트에 놓아 주세요.')}else if(id==='cup'){if(target==='cupmachine'&&step==='cup'&&order.parts.includes('shot')){cupAt='machine';step='brew'}else if(target==='finish'&&(step==='finish'||(step==='cup'&&!order.parts.includes('shot')))){cupAt='finish';benchView='finish';positions.ice=[1100,395];step='ingredients';checkRecipe()}else if(target==='serve'&&step==='serve'){cupAt='serve';serve();return}else toast('컵을 현재 단계에 맞는 자리로 옮겨 주세요.')}else if(id==='milk'&&target==='steam'&&!order.cold&&cupAt==='finish'&&order.parts.includes('milk')&&!parts.includes('milk')){positions.milk=[805,440];toast('스팀 버튼을 길게 눌러 우유를 데워 주세요.')}else if(['milk','water','choco','ice'].includes(id)&&(target==='cup'||target==='finish')){if(cupAt!=='finish'){toast('컵을 먼저 마무리 테이블에 놓아 주세요.');return}if(parts.includes(id)){toast('이미 넣은 재료예요.');return}if(id==='milk'&&!order.cold&&!milkReady){toast('따뜻한 라테는 우유를 먼저 스팀으로 데워 주세요.');return}if(id==='water'||id==='milk'){if(!order.parts.includes(id)){toast('이 주문에는 '+(id==='water'?'물':'우유')+'이 필요하지 않아요.');return}pourReady=id;attemptFeedback='';if(id==='water')positions.water=[1040,405];else positions.milk=[1040,405];toast('컵 위에 준비했어요. 「꾹 '+(id==='water'?'물':'우유')+' 붓기」를 길게 눌러 직접 부어 주세요.')}else if(id==='ice'){if(!order.cold){toast('따뜻한 음료에는 얼음을 넣지 않아요.');return}pourReady='ice';positions.ice=[1040,405];attemptFeedback='';toast('「꾹 얼음 넣기」를 길게 눌러 양을 맞춰 주세요.')}}else toast('도구를 알맞은 위치로 옮겨 주세요.');selected=null;render();if(id==='tamper'&&tamped&&(target==='mat'||target==='filter'))remember('탬핑 완료','210 385 330 260');else if(id==='milk'&&parts.includes('milk'))remember('우유 붓기 완료','840 320 360 300');else if(id==='filter'&&target==='machine'&&step==='cup')remember('포터필터 장착','365 140 455 430')}
function checkRecipe(){const req=[...order.parts,...(order.cold?['ice']:[])].sort();if(JSON.stringify([...parts].sort())===JSON.stringify(req))step='serve';else{step='ingredients';if(parts.some(x=>!req.includes(x)))toast('주문에 없는 재료가 들어갔어요. 「이번 음료 다시 만들기」로 다시 도전하세요.')}}
function beginHold(kind){if(view!=='work'||holding)return;let valid=kind==='tamp'?step==='tamp'&&tampReady:kind==='grind'?step==='grind':kind==='brew'?step==='brew':kind==='steam'?step==='ingredients'&&positions.milk[0]===805&&!milkReady&&!order.cold:['water','milk','ice'].includes(kind)&&step==='ingredients'&&pourReady===kind&&!parts.includes(kind);if(!valid){toast('안내에 따라 도구를 먼저 준비해 주세요.');return}attemptFeedback='';holding=kind;holdValue=0;last=0;holdStartLevel=liquidLevel;if(kind==='brew')liquidLevel=0;$('meter').classList.remove('hidden');render();raf=requestAnimationFrame(tick)}
function tick(t){if(!holding)return;if(!last)last=t;holdValue=Math.min(100,holdValue+(t-last)/45);last=t;if(holding==='brew')liquidLevel=Math.min(.95,holdValue/65*(order.name==='에스프레소'?.78:.24));if(holding==='ice')liquidLevel=Math.min(.95,holdStartLevel+(holdValue/65)*.04);if(holding==='water'||holding==='milk')liquidLevel=Math.min(.95,holdStartLevel+(holdValue/65)*(.78-holdStartLevel));updateLiquid();$('needle').style.left=Math.min(98,holdValue)+'%';$('focus-needle').style.left=Math.min(98,holdValue)+'%';const label=({grind:'원두 분쇄',brew:'에스프레소 추출',steam:'우유 데우기',water:'물 붓기',milk:'우유 붓기',ice:'얼음 넣기',tamp:'탬핑 압력'})[holding]+' '+Math.round(holdValue)+'% · 초록에서 놓기';$('focus-value').textContent=label;$('metertext').textContent=label;if(holdValue===100){endHold();return}raf=requestAnimationFrame(tick)}
function endHold(){if(!holding)return;let kind=holding,v=holdValue;cancelHold();if(v<58||v>80){liquidLevel=holdStartLevel;const item=({grind:'분쇄량',brew:'추출량',tamp:'탬핑 압력',steam:'스팀 온도',water:'물의 양',milk:'우유의 양',ice:'얼음의 양'})[kind];attemptFeedback=item+'이 '+(v<58?'부족해요.':'기준을 넘었어요.')+' 이 작업을 다시 해 주세요. (초록 구간 58~80%)';focusDismissed=null;$('needle').style.left='0%';$('focus-needle').style.left='0%';toast(attemptFeedback);render();return}attemptFeedback='';let score=100;scores.push(score);if(kind==='grind'){ground=true;step='mat'}if(kind==='tamp'){tamped=true;tampReady=false;positions.tamper=[410,530];step='mount';effect='tamp';setTimeout(()=>{effect=null;render()},650)}if(kind==='brew'){liquidLevel=Math.min(.95,v/65*(order.name==='에스프레소'?.78:.24));parts.push('shot');step='finish'}if(kind==='steam'){milkReady=true;positions.milk=[1100,470]}if(kind==='ice'){liquidLevel=Math.min(.92,holdStartLevel+.04);parts.push('ice');pourReady=null;positions.ice=[1100,395];checkRecipe()}if(kind==='water'||kind==='milk'){liquidLevel=Math.min(.95,holdStartLevel+(v/65)*(.78-holdStartLevel));parts.push(kind);pourReady=null;positions.water=[1050,550];positions.milk=[1100,470];checkRecipe()}sound(score===100?650:400,.15);toast((score===100?'딱 좋아요! ':'작업 완료! ')+({grind:'원두를 갈았어요.',brew:'에스프레소를 추출했어요.',steam:'우유를 따뜻하게 데웠어요.',water:'물을 부었어요.',milk:'우유를 부었어요.',ice:'얼음을 알맞게 넣었어요.',tamp:'커피 가루를 고르게 다졌어요.'})[kind]);render();remember(({grind:'원두 분쇄 완료',brew:'에스프레소 추출 완료',steam:'우유 스팀 완료',water:'물 붓기 완료',milk:'우유 붓기 완료',ice:'얼음 넣기 완료',tamp:'탬핑 완료'})[kind],({grind:'75 150 270 375',brew:'365 145 440 430',steam:'660 285 270 270',water:'845 350 350 255',milk:'845 350 350 255',ice:'845 350 350 255',tamp:'210 385 330 260'})[kind])}

let audio;function sound(f,d){try{audio??=new (window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=f;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.start();o.stop(audio.currentTime+d)}catch{}}
function serve(){const q=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):100;const tip=Math.round(((state.decor?500:300)+Math.min(chatCount,2)*50)*q/100);bill={price:order.price,tip,q,total:order.price+tip,paid:false};service='handoff';view='lobby';benchView='machine';feedback='';sound(650,.15);render();remember('서빙 준비','0 0 1200 650')}
function handToCustomer(){if(service!=='handoff')return;service='payment';chatReply='고마워요! '+order.name+' 향이 정말 좋네요. 얼마인가요?';sound(750,.12);render();remember('손님께 음료 전달','0 0 1200 650')}
function takePayment(){if(service!=='payment'||!bill||bill.paid)return;bill.paid=true;state.money+=bill.total;state.count++;let ending='';if(state.count===5){state.day++;state.count=0;ending=' 오늘 영업도 수고하셨어요!'}service='goodbye';feedback='정말 맛있어요. 이야기 나눠서 더 좋았어요! 다음에 또 올게요.'+ending;save();sound(900,.2);render();remember('계산 완료','0 0 1200 650')}
function talk(topic){if(service!=='chat')return;myWords=({day:'오늘 하루는 어떠셨어요?',coffee:'어떤 커피를 좋아하세요?',recommend:'부드러운 카페라떼 한 잔 어떠세요?'})[topic];service='chat_reply';chatCount=Math.min(3,chatCount+1);if(topic==='day')chatReply=guest.day;else if(topic==='coffee')chatReply=order.name==='카페라떼'?'저는 우유가 들어간 부드러운 커피가 좋아요. 라떼를 마시면 편안해져요.':order.name==='아메리카노'?'저는 깔끔하고 향이 좋은 커피를 좋아해요. 아메리카노가 딱이죠.':'오늘은 커피 본연의 진한 향을 느끼고 싶어요. 에스프레소가 좋겠네요.';else{chatReply='추천해 주시니 카페라떼가 좋겠어요! 부드러운 커피가 당기네요.';order={...recipes[2],cold:false}}render()}
function renderService(){const choices=$('choices');choices.replaceChildren();$('name').textContent=guest?.name||'청원학교의 손님';let line='',button='';$('accept').hidden=false;const chatting=['greet','chat','chat_reply','confirm'].includes(service);$('chat-progress').hidden=!chatting;const phase=service==='greet'?0:service==='confirm'?2:1;$('chat-progress').innerHTML=['인사하기','이야기 나누기','주문 확인'].map((t,i)=>'<span class="'+(i<phase?'done':i===phase?'current':'')+'">'+(i<phase?'✓':i+1)+' '+t+'</span>').join('');$('speaker').textContent='손님이 말해요';$('myline').hidden=!myWords||!['chat_reply','confirm'].includes(service);$('myline').textContent='나: “'+myWords+'”';$('choice-label').hidden=service!=='chat';
function option(label,action){const b=document.createElement('button');b.textContent=label;b.onclick=action;choices.append(b);return b}
if(service==='greet'){line='안녕하세요!';button='어서 오세요! 반갑게 인사하기 →'}else if(service==='chat'){line=guest.hello;button='';$('accept').hidden=true;for(const [text,topic]of [['오늘 하루는 어떠셨어요?','day'],['어떤 커피를 좋아하세요?','coffee'],['부드러운 카페라떼 한 잔 어떠세요?','recommend']])option('“'+text+'”  →',()=>talk(topic));const skip=option('대화는 다음에 · 바로 주문받기',()=>{myWords='무엇을 드릴까요?';service='confirm';render()});skip.className='chat-skip'}else if(service==='chat_reply'){line=chatReply;button='그렇군요! 이제 주문 도와드릴게요 →'}else if(service==='confirm'){line=(order.cold?'시원한 아이스 ':'따뜻한 ')+order.name+' 한 잔 부탁해요!';button=(order.cold?'아이스 ':'따뜻한 ')+order.name+' 만들기 →';$('speaker').textContent='손님의 주문';if(order.name!=='에스프레소'){for(const [text,cold]of [['따뜻하게',false],['아이스',true]]){const b=option((order.cold===cold?'✓ ':'')+text,()=>{order.cold=cold;render()});b.className='temperature'+(order.cold===cold?' picked':'');b.setAttribute('aria-pressed',String(order.cold===cold))}}}else if(service==='making'){line='천천히 만들어 주세요. 향긋한 커피를 기다릴게요.';button='만들던 음료로 돌아가기 →'}else if(service==='handoff'){line='와, 제 커피가 준비됐나요? 기대돼요!';button='손님께 음료 드리기 →'}else if(service==='payment'){line=chatReply;button='결제 받기 · '+bill.total.toLocaleString()+'원'}else{line=feedback;button='인사하고 다음 손님 맞이하기 →'}$('dialogue').textContent=line;$('accept').textContent=button;const receipt=$('receipt');receipt.hidden=!['payment','goodbye'].includes(service);if(!receipt.hidden&&bill){receipt.className='bill';receipt.innerHTML='<div><span>'+order.name+'</span><span>'+bill.price.toLocaleString()+'원</span></div><div><span>감사 팁 · 품질 '+bill.q+'점</span><span>'+bill.tip.toLocaleString()+'원</span></div><div class="total"><span>'+(bill.paid?'결제 완료':'받을 금액')+'</span><span>'+bill.total.toLocaleString()+'원</span></div>'}}

function point(e){let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function atTarget(x,y){if(view==='lobby'&&service==='handoff'&&x>200&&x<510&&y>300&&y<560)return 'customer';if(Math.hypot(x-positions.cup[cupAt][0],y-positions.cup[cupAt][1])<60&&drag?.id!=='cup')return 'cup';if(Math.hypot(x-350,y-535)<65)return 'mat';if(Math.hypot(x-210,y-395)<70)return 'grinder';if(Math.hypot(x-600,y-365)<70)return 'machine';if(Math.hypot(x-600,y-490)<65)return 'cupmachine';if(Math.hypot(x-1040,y-350)<85)return 'serve';if(Math.hypot(x-950,y-485)<95)return 'finish';if(Math.hypot(x-805,y-440)<75)return 'steam';return null}
svg.addEventListener('pointerdown',e=>{if(view!=='work'&&!(view==='lobby'&&service==='handoff'))return;const h=e.target.closest('[data-hold]');if(h){e.preventDefault();svg.setPointerCapture(e.pointerId);beginHold(h.dataset.hold);return}let obj=e.target.closest('[data-object]');if(obj){e.preventDefault();let p=point(e),id=obj.dataset.object;let pos=id==='filter'?positions.filter[filterAt]:id==='cup'?positions.cup[cupAt]:positions[id];drag={id,x:p.x,y:p.y,sx:p.x,sy:p.y,ox:pos[0],oy:pos[1],moved:false};svg.setPointerCapture(e.pointerId)}});
svg.addEventListener('pointermove',e=>{if(!drag)return;const p=point(e);drag.x=p.x;drag.y=p.y;if(Math.hypot(p.x-drag.sx,p.y-drag.sy)>8)drag.moved=true;if(drag.moved)render()});
svg.addEventListener('pointerup',e=>{if(holding){endHold();return}if(!drag)return;let d=drag,p=point(e),target=atTarget(p.x,p.y);drag=null;if(d.moved){if(target)move(d.id,target);else{toast('도구가 제자리로 돌아왔어요. 표시된 자리로 옮겨 보세요.');render()}}else{if(selected&&selected!==d.id&&['cup','filter'].includes(d.id)){move(selected,d.id)}else{selected=selected===d.id?null:d.id;render()}}});
